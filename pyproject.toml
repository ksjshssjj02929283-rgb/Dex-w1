[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "dexe_robot_client"
version = "0.1.1"
description = "DexEmbodied Robot Client"
authors = [
    { name = "Dexforce", email = "dexforce@dexforce.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "colorlog",
    "numpy>=1.24.4,<2",
    "scipy>=1.12",
    "toppra==0.6.3",
    "pin>=2.7.0",
    "trimesh>=4.2.4",
    "open3d",
    "pathfinding",
    "loop_rate_limiters"
]

[project.optional-dependencies]
dev = [
    "pytest", 
    "black",
    "build"
]

[tool.black]
line-length = 88
target-version = ['py310']