[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dexe_robot_client.navigation_client" = [
    "README.md",
    "docs/*.md",
    "docs/*.json",
    "docs/*.py",
]

[project]
name = "dexe_robot_client"
version = "0.7.1"
description = "DexEmbodied Robot Client"
authors = [
    { name = "Dexforce", email = "dexforce@dexforce.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "colorlog",
    "numpy>=1.24.4,<2",
    "scipy>=1.12",
    "toppra==0.6.3",
    "trimesh>=4.2.4",
    "pathfinding",
    "dexe_rp>=0.4.2"
]

[project.scripts]
dexe_robot_client-install-scripts = "dexe_robot_client.cli:export_scripts"
dexe-navigation-client-test = "dexe_robot_client.navigation_client.interface_test:main"

[project.optional-dependencies]
dev = [
    "pytest", 
    "black",
    "build"
]

[tool.black]
line-length = 88
target-version = ['py310']
