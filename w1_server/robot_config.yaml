# 注意: 真机实际加载的是 ~/dexe_robot_server_data/robot_config.yaml.
# 启动时 main.cpp:CheckConfig 会把"用户 yaml 缺的字段"从这里 merge 过去 (补缺不覆盖).
# 修改本文件中的值后, 想让真机生效要么删用户 yaml 触发重建, 要么手动编辑用户 yaml 同步.

# === 机器人基本配置 ===
config_version: v01
robot_type: w1
version: v024
left_hand_type: null
right_hand_type: null

file_path:
  robot_urdf: ../install/robot_server_lib/share/robot_server_lib/robot_models/w1/robot.urdf
ros2_to_urdf_map:
  ANKLE: ANKLE
  KNEE: KNEE
  BUTTOCK: BUTTOCK
  WAIST: WAIST
  NECK1: NECK1
  NECK2: NECK2
  LEFT_J1: LEFT_J1
  LEFT_J2: LEFT_J2
  LEFT_J3: LEFT_J3
  LEFT_J4: LEFT_J4
  LEFT_J5: LEFT_J5
  LEFT_J6: LEFT_J6
  LEFT_J7: LEFT_J7
  RIGHT_J1: RIGHT_J1
  RIGHT_J2: RIGHT_J2
  RIGHT_J3: RIGHT_J3
  RIGHT_J4: RIGHT_J4
  RIGHT_J5: RIGHT_J5
  RIGHT_J6: RIGHT_J6
  RIGHT_J7: RIGHT_J7

# === 关节分组配置 ===
# 主臂关节名称（左臂，7自由度）
joints_primary_names: [LEFT_J1, LEFT_J2, LEFT_J3, LEFT_J4, LEFT_J5, LEFT_J6, LEFT_J7]
# 从臂关节名称（右臂，7自由度）
joints_secondary_names: [RIGHT_J1, RIGHT_J2, RIGHT_J3, RIGHT_J4, RIGHT_J5, RIGHT_J6, RIGHT_J7]
# 躯干关节名称（3个）
joints_torso_names: [ANKLE, KNEE, BUTTOCK]
# A1模式关节名称
joints_a1: [NECK1, NECK2 ,LEFT_J1, LEFT_J2, LEFT_J3, LEFT_J4, LEFT_J5, LEFT_J6, LEFT_J7, RIGHT_J1, RIGHT_J2, RIGHT_J3, RIGHT_J4, RIGHT_J5, RIGHT_J6, RIGHT_J7]
# arm模式关节名称
joints_single_arm: [LEFT_J1, LEFT_J2, LEFT_J3, LEFT_J4, LEFT_J5, LEFT_J6, LEFT_J7]
# dual_arm模式关节名称
joints_dual_arm: [LEFT_J1, LEFT_J2, LEFT_J3, LEFT_J4, LEFT_J5, LEFT_J6, LEFT_J7, RIGHT_J1, RIGHT_J2, RIGHT_J3, RIGHT_J4, RIGHT_J5, RIGHT_J6, RIGHT_J7]
# 末端执行器名称
ee_primary_name: LEFT_GRIPPER
ee_secondary_name: RIGHT_GRIPPER

# === 通用配置 ===
enable_record: false
safe_level: 0.5
global_speed_ratio: 1.0

# === 是否启用力传感器（false 时走无外力/无导纳的纯关节阻抗模式）===
allow_force_sensor: true

# === 外力传感器进入关节阻抗控制前的死区与饱和 ===
force_sensor_external_wrench:
  model_sign: -1               # 正号是放大外力，负号是抵消外力
  force_deadband_n: 3.0
  force_saturation_n: 100.0
  torque_deadband_nm: 0.1
  torque_saturation_nm: 10.0

# === 关节 admittance 整形 ===
joint_admittance:
  enabled: true
  torque_ext_direct_gain: 0.0
  default:
    torque_gain: -0.7         # 负号是顺应外力的移动，绝对值的大小代表利用的外力矩的多少
    virtual_inertia: 1.0
    natural_frequency_hz: 1.5
    damping_ratio: 1.2
    offset_limit: 0.05
    velocity_limit: 0.2
    acceleration_limit: 1.3
  groups:
    primary_shoulder:
      joints: [LEFT_J1, LEFT_J2, LEFT_J3, LEFT_J4]
      virtual_inertia: 0.6
      natural_frequency_hz: 0.6
      damping_ratio: 1.6
      offset_limit: 0.2
    primary_elbow_wrist:
      joints: [LEFT_J5, LEFT_J6, LEFT_J7]
      virtual_inertia: 0.4
      natural_frequency_hz: 0.5
      damping_ratio: 1.5
      offset_limit: 0.15

# === 工具补偿参数 ===
# 坐标系约定: com_mm 与 inertia_com_kg_m2 都在 EE/法兰系下表达
# 惯量张量 (单位 kg·m^2), 不是关于 EE 原点的. 改坐标系/参考点后必须重新生成.
tool_gravity_compensation:
  com_mm: [-0.15804154,0.70721872,50.33428542]   # COM 相对 EE 原点的偏移, 单位 mm, 在 EE 系下
  mass_kg: 1.061
  gravity_magnitude: 9.79
  inertia_com_kg_m2: [[0.00111446, 0.0001123, 0],
                       [0.0001123, 0.00123732, 0],
                       [0, 0, 0.00065]]  # I_C^EE, 关于 COM, EE 系基
  model_sign: 1
  # 末端加速度 / 关节加速度的低通截止 (Hz), 用于在线惯量补偿. 默认 5.0 与脚本一致.
  # 静止时 G1 诊断字段 (tool_inertia_force_norm/torque_norm) 显示噪声偏大 -> 调低 (3 ~ 4)
  # 快速运动跟踪不上 -> 调高 (8 ~ 10). 合法区间 [0.5, 100].
  inertia_compensation_filter_hz: 5.0
  
# === 底盘配置 ===
# 底盘类型: omni (全向轮) / diff_drive (差速驱动)
chassis_config:
  chassis_type: "diff_drive"
  enable_chassis_shaper: false

