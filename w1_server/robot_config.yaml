  RIGHT_J4: RIGHT_J4
  RIGHT_J5: RIGHT_J5
  RIGHT_J6: RIGHT_J6
  RIGHT_J7: RIGHT_J7

# === 关节分组配置 ===
# 主臂关节名称（左臂，7自由度）
joints_primary_names: [LEFT_J1, LEFT_J2, LEFT_J3, LEFT_J4, LEFT_J5, LEFT_J6, LEFT_J7]
# 从臂关节名称（右臂，7自由度）
joints_secondary_names: [RIGHT_J1, RIGHT_J2, RIGHT_J3, RIGHT_J4, RIGHT_J5, RIGHT_J6, RIGHT_J7]
# 躯干关节名称（3个）
joints_torso_names: [ANKLE, KNEE, BUTTOCK]
# A1模式关节名称
joints_a1: [NECK1, NECK2 ,LEFT_J1, LEFT_J2, LEFT_J3, LEFT_J4, LEFT_J5, LEFT_J6, LEFT_J7, RIGHT_J1, RIGHT_J2, RIGHT_J3, RIGHT_J4, RIGHT_J5, RIGHT_J6, RIGHT_J7]
# arm模式关节名称
joints_single_arm: [LEFT_J1, LEFT_J2, LEFT_J3, LEFT_J4, LEFT_J5, LEFT_J6, LEFT_J7]
# dual_arm模式关节名称
