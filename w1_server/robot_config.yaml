config_version: v01
robot_type: w1
version: v024
left_hand_type: null
right_hand_type: null

file_path:
  robot_urdf: ../install/robot_server_lib/share/robot_server_lib/robot_models/w1/robot.urdf
ros2_to_urdf_map:
  ANKLE: ANKLE
  KNEE: KNEE
  BUTTOCK: BUTTOCK
  WAIST: WAIST
  NECK1: NECK1
  NECK2: NECK2
