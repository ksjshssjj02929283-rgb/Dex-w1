# 末端执行器名称
ee_primary_name: LEFT_GRIPPER
ee_secondary_name: RIGHT_GRIPPER

# === 通用配置 ===
enable_record: false
safe_level: 0.5
global_speed_ratio: 1.0

# === 底盘配置 ===
# 底盘类型: omni (全向轮) / diff_drive (差速驱动)
