chassis_node:
  ros__parameters:

    # ================================================================
    # 底盘物理参数
    # ================================================================
    # ⭐ 底盘几何的**唯一真值源**：正解（里程计）与逆解（速度命令下发）共用这一套，
    #    任一项热更新后两侧同时生效，不会出现"里程准了、命令偏了"。
    #    对应 chassis_kinematics.h::ChassisGeometry，由 ApplyKinematicsParams() 单点装配。
    #
    # 这里只放**名义值**——图纸或卷尺量出来的物理尺寸，钉死不参与标定；
    # 线尺度误差统一由下面「标定系数」段的 odom_factor 吸收。
    #
    # —— 差速 ——
    diff_track: 0.4390          # 轴距 b (m)。理论与手动标定见 document/diff_odom_calib.md
    diff_wheel_radius: 0.0865   # 轮半径 r (m)，173 mm 直径名义值；左右相同

    # —— 全向（四舵轮）——
    omni_wheelbase: 0.460       # L：前后轮心距 (m)，沿 x
    omni_track: 0.345           # W：左右轮心距 (m)，沿 y
    omni_wheel_diameter: 0.107  # 轮径 (m)

    # 旧参数名 wheel_track / wheel_track_eff / wheel_radius 已弃用。
    # 为兼容已部署的 yaml，节点仍会读取它们：新名未给而旧名给了时采用旧值并打 WARN。
    odom_frame:  "odom"       # 里程计坐标系名
    base_frame:  "base_footprint"  # 机体坐标系名
    odom_rate_hz: 100.0       # 里程计发布频率 (Hz)

    # ================================================================
    # 里程计模式（四选一，可热切换；进/出 EKF 时自动灌初值/接续协方差，无位姿跳变）
    # ================================================================
    #   encoder_only : 纯编码器——v 与 θ 都来自编码器（标定 odom_factor / diff_track 时用）
    #   imu_yaw      : IMU 航向——v 来自编码器，θ 由陀螺积分（非 EKF 直接积分）
    #   ekf          : EKF 融合——IMU 驱动预测，编码器 (v, ω) 做量测与检测（运行模式）
    #   ekf_no_imu   : EKF 无 IMU——匀速假设预测 + 编码器 2 维更新；IMU 掉线时 ekf 自动退化到此态
    # IMU 在任何模式下都只提供航向/角速度，位置始终来自编码器。
    odom_mode: ekf

    # ================================================================
    # 标定系数
    # ================================================================
    # ⚠️ odom_factor **对称**作用于两侧：正解上报速度 ×factor、逆解下发转速 ÷factor。
    #    含义是"编码器的名义换算比真实值小了多少"，标一次两边都对；默认 1.0 时与改前逐位一致。
    #
    # 🔭 它是**集总系数**（一个数吃掉所有线尺度误差），比较粗暴，后续可能被更具体的参数取代：
    #    逐轮轮径修正（分离左右轮径不等造成的弧线漂移）/ 舵角零位偏置 / 角尺度单列。
    #    届时只需改 chassis_kinematics.h 的 ChassisCalibration 与四个换算函数，
    #    几何、调用点与上层命令通路都不用动——这是把标定量与名义几何分开放的目的。
    #    注意：odom_factor 这个名字是标定 App 的外部契约（calib_odom_factor 的 sensor_name），不要改名。
    odom_factor: 1.0    # 编码器线尺度标定量，由 calib_odom_factor 用激光真值写入（laser_dist / odom_dist）
                        # 乘在轮速层：v 与 ω_enc 同时修正，ChassisMotorFeedback.speed_mps 亦含此系数
    imu_factor:  1.0    # IMU 角速度整体缩放（等效陀螺比例误差）

    # 舵角零位偏置 (rad)：轮子真实几何朝向 = 舵角编码器读数 + 本值。
    # 与 odom_factor 一样**对称**作用：正解按 +zero 还原真实朝向，逆解按 −zero 生成编码器目标。
    # 轮序 fl 左前 / fr 右前 / rl 左后 / rr 右后（同 ChassisKinematics::OmniWheelIndex）。
    #
    # ⚠️ 零位不齐不只是里程计不准：四轮速度矢量互不平行，底盘被合力矩推着转——
    #    前后轴零位差 1° ⇒ 直行 10 m 偏航约 22°，残差由轮胎侧向变形吸收（摩地、电机过载）。
    #    反推：直行 d 米偏航 Δθ ⇒ 前后轴零位差 ≈ (L/d)·Δθ，L=0.46 m 时 10 m 行程约 0.046·Δθ。
    # 标定方法见项目《四轮全向底盘标定方案》；全 0 时与引入本参数前逐位一致。
    #
    # ⚠️ 这是**过渡方案**。零位是执行器的固有属性、是每台机器的实例数据，目标态应固化到
    #    底盘控制 MCU（读回当前零偏 → 标定出增量 → 累加写回），让 MCU 报出的角度就是真实朝向。
    #    在此之前本参数只补偿了 chassis_node 的正解与 w1_server 的逆解两处；
    #    **发布到 /feedback/chassis_motors 的 position 仍是未补偿的原始值**
    #    （chassis_node.cpp PublishMotorFeedback），monitor_shm.py / joint_analyzer.py 同理。
    #    ⛔ 导航联调前必须先解决：要么切 MCU，要么把补偿点上移到共享内存读取处。
    #       否则 mobile_cmd_omni 用未补偿角度作转向平滑基准，与底层解算不一致。
    omni_steer_zero_fl: 0.0     # 左前，rad（1° = 0.017453 rad）
    omni_steer_zero_fr: 0.0     # 右前
    omni_steer_zero_rl: 0.0     # 左后
    omni_steer_zero_rr: 0.0     # 右后

    # ================================================================
    # IMU 静止初始化参数
    # ================================================================
    # 静止判据 = 加速度标准差 + 角速度标准差 + |‖acc‖-g| 容差 + 编码器轮速静止。
    # 注意：陀螺角速度「均值」不是静止判据——静止时它恒等于待估的陀螺零偏，
    # 拿它当判据会让零偏偏大的器件永远无法完成初始化。
    imu_max_buff_size:      500    # 积累帧数（100 Hz 下 = 5 秒静止）
    acc_excite_threshold:   0.04   # 加速度标准差阈值 (m/s²)
    gyro_excite_threshold:  0.004  # 角速度标准差阈值 (rad/s ≈ 0.23°/s)
    acc_magnitude_tolerance: 0.2   # |‖acc_avg‖-g| 容差 (m/s²)，识别静止期残留线加速度
    gyro_bias_warn_threshold: 0.01 # 零偏告警门限 (rad/s ≈ 0.57°/s)
                                   # 仅告警不阻断初始化；超过说明器件零偏异常或初始化时机体有蠕动
    imu_reinit_duration:    3600.0 # 自动重初始化间隔 (s)，负值=禁用
    gravity_magnitude:      9.7887 # 当地重力加速度 (m/s²)
                                   # 查询：https://www.wolframalpha.com/input?i=gravity+at+latitude+xxx

    # ================================================================
    # 死区参数
    # ================================================================
    speed_deadzone: 0.001   # 线速度静止死区 (m/s)
    omega_deadzone: 0.008   # 角速度静止死区 (rad/s ≈ 0.46°/s)
    imu_timeout:    0.1     # IMU 超时时间 (s)，超时后回退编码器
                            # 判据基准是消息 stamp：两条来源同为节点时钟（w1_server 同进程；
                            # dexe_sensors/imu 已改用节点时钟），能一并检出订阅队列积压。
                            # 跨源 sanity 检查在 IsImuAvailable 里兜底。
    odom_stale_timeout: 0.5 # 底盘反馈失效判定 (s)：反馈持续无效超过此值即停发里程计与 TF，
                            # 只报 ERROR，恢复后自动续发（fail-fast，不做降级续航）。
                            # 共享内存读取自带 10 ms 新鲜度门，本值是在其上加的持续时长门槛，
                            # 用来滤掉抖动；50 个周期，与积分侧 dt > 0.5 s 的丢帧保护同值。

    # IMU 来源自动判定的宽限期 (s)。
    # 0.3.0 硬件 IMU 挂独立串口由 dexe_sensors/imu 发话题；0.3.1 走 EtherCAT 进共享内存。
    # 两版话题同名（/imu/chassis），故按「共享内存里 IMU 时间戳是否在变」判定：
    # 期内观察到变化 => 直接读 shm（少一跳序列化+传输）；超时未变 => 订阅话题。
    # 判据用「在变」而非「非零」：启动瞬间 EtherCAT 可能未就绪，全零会误判成 0.3.0。
    imu_source_detect_grace: 5.0

    # ================================================================
    # 全向底盘命令生成（逆解后的下发策略；差速不用）
    # ================================================================
    omni_steer_limit: 2.5132741  # 舵角软限位 (rad)，0.8π ≈ 144°
    omni_speed_ramp: 0.8         # 速度趋近系数：下发 = 实测 + ramp·(目标 − 实测)

    # 对齐限速（逐轮连续，取代原来"四轮都进 1.0 rad 门才给速度"的全或无门控）
    # 舵角没到位就给全速 ⇒ 轮速的横向分量全是侧滑（摩地）；一轮没到位就四轮全停 ⇒ 走走停停。
    # 调法：底盘迟钝就调大 full / min_scale；换向摩地就调小它们。
    omni_align_full: 0.12        # ≤此误差 (rad) 不限速，≈7°
    omni_align_crawl: 0.90       # ≥此误差只剩爬行能力，≈52°
    omni_align_min_scale: 0.08   # 爬行系数下限

    # 轮速上限：任一轮超限时四轮**同比**缩放（保持 ω/|v| 与瞬心）；≤0 表示不限制
    omni_max_wheel_speed: 1.5    # m/s

    # 单轮矢量死区：轮子接近瞬心时方向由噪声决定，低于此速度保持当前舵角
    omni_wheel_vector_deadband: 0.03  # m/s
    cmd_vel_timeout: 0.5         # /control/cmd_vel 停发多久后清速度控制权 (s)
    parking_cmd_timeout: 0.30    # 驻车/对轮指令停发多久后释放控制权 (s)

    # ================================================================
    # IMU 健康判定（失效五类：非有限值 / 冻结 / 超时 / 噪声 / 未初始化；恢复带迟滞）
    # 状态经 /diagnostics 外发（status 名 "chassis_node: IMU" / "chassis_node: odom feedback"，节点名前缀由 updater 自动加）
    # ================================================================
    imu_invalid_frames:  3      # 连续非有限值（NaN/Inf）帧数 → 判无效，帧被丢弃不进 EKF
    imu_frozen_frames:   20     # 连续六轴完全相同帧数 → 判冻结（0.2 s @100 Hz）
    imu_gyro_noise_max:  0.02   # 陀螺 z **帧间差分** 1 s 滑窗标准差上限 (rad/s)。用差分而非原始值：
                                # 真实转动 100 Hz 下差分仅 ω̇·dt≈0.01 且平滑，噪声/振动是随机跳变；
                                # 静止实测差分 std 约 0.002，取 10 倍
    imu_recover_frames:  20     # 失效解除后需连续正常帧数才恢复可用（防 EKF 在两模式间逐帧翻转）
    imu_init_timeout:    30.0   # 静止初始化超过此时长未完成，告警升 ERROR (s)
    diag_period:         0.5    # /diagnostics 发布周期 (s)；健康状态变化时立即补发一帧

    # ================================================================
    # EKF 参数（odom_mode 为 ekf / ekf_no_imu 时生效；非 EKF 模式亦用同一套 Q/R 填协方差）
    # ================================================================

    # -- 过程噪声 Q（**每秒**扩散，内部乘 dt；值越大代表过程模型越不可信）--
    # ⚠ 量纲是 /s 不是 /step。按每步定义会让滤波行为随 odom_rate_hz 漂移：
    #   同一组参数在 50/100/200 Hz 下代表的物理噪声不同，且提高发布频率不改善精度。
    ekf_q_xy:     1.0e-4    # 位置扩散 (m²/s)，模型失配兜底项
    ekf_q_theta:  1.0e-6    # 航向扩散 (rad²/s)，量级由陀螺零偏残差主导（~1e-4 rad/s）
                            # θ 在 H 中无量测、只增不减；此值过大会让 yaw 协方差迅速失去意义
    ekf_q_v:      1.0       # 线速度扩散 ((m/s)²/s)，按底盘加速度能力取
    ekf_q_omega:  1.0       # 角速度扩散 ((rad/s)²/s)，**仅无 IMU 时**起作用
    ekf_q_omega_imu: 1.0e-4 # IMU 模式下 ω 的不确定度 ((rad/s)²/s)，代表陀螺测量噪声
                            # IMU 模式下 ω 是输入不是被估计量，用 ekf_q_omega 会高估两个数量级：
                            # 既让 twist 协方差失真，也削弱打滑检测的统计显著性

    # -- 零速修正 ZUPT（整车静止时生效）--
    # 静止时预测不积分 IMU 零偏残差，并以 [v,ω]=[0,0] 作为强量测。
    # 不加此约束时，静止期零偏残差会持续积进 θ 且永不修正（1e-4 rad/s ⇒ 1 小时约 20°）。
    ekf_r_zupt:           1.0e-6  # 零速量测噪声，越小越信任"确实没动"
    ekf_q_scale_stopped:  0.01    # 静止时过程噪声缩放（静止模型近乎完美）

    # -- 编码器量测噪声 R（正常行驶，值越大代表编码器越不可信）--
    ekf_r_v:      0.05      # 线速度量测噪声 ((m/s)²)
    ekf_r_omega:  0.01      # 角速度量测噪声 ((rad/s)²)

    # -- 悬空/打滑时编码器量测噪声（放大，使 EKF 忽略不可信编码器）--
    ekf_r_v_aerial:     100.0
    ekf_r_omega_aerial: 100.0

    # -- 悬空检测 Mahalanobis 距离阈值 --
    # χ²(2, 99%) = 9.21 | χ²(2, 95%) = 5.99 | χ²(2, 99.9%) = 13.82
    # 值越小检测越敏感（误报率越高）
    ekf_aerial_chi2_threshold: 9.21

    # -- EKF 初始协方差对角（滤波器复位时的初值）--
    # ⚠ 位姿两项必须趋近 0，不能按「先给个不确定量」的直觉设。
    #   odom frame 按定义就是启动位姿：启动瞬间 base 与 odom 重合，(x,y,θ)≡0 且完全确定。
    #   设成 0.01（σ=0.1 m / 5.73°）的后果是初值淹没真实漂移——q_theta=1e-6 跑 91 s 才累积
    #   9.1e-5 rad²、仅占 0.01 的 0.9%，σyaw 曲线几乎是常数 5.73°，对上层不携带任何信息。
    #   取 1e-9 而非严格 0，只为避开可能的病态求逆路径；首次 Predict 的 Q·dt 就会把 P 抬起来。
    ekf_p0_xy:    1.0e-9  # 位置初始方差 (m²)
    ekf_p0_theta: 1.0e-9  # 航向初始方差 (rad²)
    ekf_p0_v:     1.0     # 线速度初始方差 ((m/s)²)
    ekf_p0_omega: 1.0     # 角速度初始方差 ((rad/s)²)

    # -- 全向（舵轮）底盘专用：6 维 EKF (x, y, θ, vx, vy, ω) 多出的侧向速度一维；差速底盘忽略 --
    # 全向 EKF 与差速同构（Q 每秒 / ZUPT / 检测-更新分离），只多 vy：位置预测按机体系 (vx, vy) 旋到 odom 系，
    # 打滑检测用 3 维新息 [Δvx, Δvy, Δω]，IMU 模式下更新只取 vx vy 两行。
    ekf_q_vy:        1.0     # 侧向速度扩散 ((m/s)²/s)，与 ekf_q_v 同量级
    ekf_r_vy:        0.05    # 侧向速度量测噪声 ((m/s)²)；舵轮侧移时轮胎侧向拖拽更常见，实机若侧移时频繁误报打滑则调大
    ekf_r_vy_aerial: 100.0   # 悬空/打滑时侧向速度量测噪声
    ekf_p0_vy:       1.0     # 侧向速度初始方差 ((m/s)²)
    ekf_aerial_chi2_threshold_3d: 11.34  # 全向 3 维检测阈值：χ²(3, 99%) = 11.34 | 95% = 7.81 | 99.9% = 16.27
