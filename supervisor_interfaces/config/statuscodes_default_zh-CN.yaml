# dexe_ethercat 状态码表。
modules:
  - module: "dexe_ethercat"
    module_name: "dexe_ethercat"
    module_id: "100"
    submodules:

      - submodule: "EtherCAT Core"
        submodule_name: "EtherCAT核心"
        submodule_id: "00"
        status_codes:
          - status_code: "10000000"
            description: "EtherCAT 模块当前纳入诊断的主站、过程数据及支持的电机未发现活动故障。"
            solution: "无需清错；若业务仍异常，结合 tools/monitor.py system --once、原始关节反馈和业务日志继续定位。"

          # 上层心跳监控判定
          - status_code: "10000002"
            description: "超过 3 秒未收到 EtherCAT 模块状态上报，由上层心跳监控判定。"
            solution: "检查 w1_ethercat 进程、CPU 调度和系统状态发布线程；读取 tools/monitor.py system --once，核对共享内存采集与上层状态转发链路是否持续更新。"

          # 上层心跳监控判定
          - status_code: "10000003"
            description: "超过 10 秒未收到 EtherCAT 模块状态上报，由上层心跳监控判定模块可能离线。"
            solution: "检查主机供电、w1_ethercat 进程及其启动服务、崩溃和阻塞日志；恢复状态采集与上报链路，并确认心跳重新连续更新。"

          - status_code: "10000011"
            description: "EtherCAT 主站尚未激活，或总线从站尚未全部进入 OP。"
            solution: "启动阶段可短暂出现；持续存在时检查 system 监控中的 master_active、master_al_state、link_up 及从站状态，核对网线、供电、PDO/DC 配置和主站日志，定位未进入 OP 的从站。"

          - status_code: "10000013"
            description: "扫描从站数量与配置预期不一致，或运行中检测到从站数量变化。"
            solution: "使用 ethercat slaves 核对实际连接和供电，检查接插件松动、掉站和当前硬件对应的配置文件；结合扫描日志确认自动识别的转接板及灵巧手，修复后重新扫描并核对数量。"

          - status_code: "10000021"
            description: "主站已激活且总线处于 OP，但当前过程数据未满足有效性条件。"
            solution: "查看 system 监控中的 data_valid、data_received、working_counter、domain_wc_state 和 wkc_ok，结合实际 PDO 配置核对期望工作计数，检查网线、供电、映射长度与实时周期。"

          - status_code: "10000023"
            description: "从站拓扑、厂商/产品信息、配置或启用校验的别名与预期不匹配。"
            solution: "对照 ethercat slaves 与当前配置的设备类型、vendor_id、product_code、alias 及顺序，检查扫描日志中的首个不匹配设备，使用与实际硬件和固件匹配的配置后重新扫描。"

          - status_code: "10000043"
            description: "EtherCAT 主站申请、从站扫描或主站激活失败。"
            solution: "查看 w1_ethercat 和 /var/log/syslog 的首个失败返回值；检查 IgH 主站、网卡/权限和主站占用情况，结合扫描、PDO/DC 配置与激活日志修复初始化条件后重新启动。"

          - status_code: "10000053"
            description: "检测到一个或多个 EtherCAT 从站的 AL 错误状态。"
            solution: "结合从站监控日志和 ethercat slaves -v 定位实际总线位置及 AL 错误，检查对应从站的供电、ESI、PDO、同步参数和固件，消除原因后按设备支持的流程确认错误并恢复 OP。"

          - status_code: "10000073"
            description: "启用许可证检查时，Sentinel 加密狗授权校验未通过或授权已失效。"
            solution: "检查加密狗连接、许可服务及许可有效期/产品匹配；联系授权管理员修复后重新验证。"

      - submodule: "Ankle"
        submodule_name: "脚踝电机"
        submodule_id: "02"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10002003"
            description: "脚踝关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10002013"
            description: "脚踝关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10002023"
            description: "脚踝关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10002033"
            description: "脚踝关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10002043"
            description: "脚踝关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10002053"
            description: "脚踝关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10002063"
            description: "脚踝关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10002073"
            description: "脚踝关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10002083"
            description: "脚踝关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10002093"
            description: "脚踝关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10002103"
            description: "脚踝关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10002113"
            description: "脚踝关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10002123"
            description: "脚踝关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10002133"
            description: "脚踝关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10002143"
            description: "脚踝关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10002153"
            description: "脚踝关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10002163"
            description: "脚踝关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10002173"
            description: "脚踝关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10002183"
            description: "脚踝关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10002193"
            description: "脚踝关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10002203"
            description: "脚踝关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10002213"
            description: "脚踝关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10002223"
            description: "脚踝关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10002233"
            description: "脚踝关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10002243"
            description: "脚踝关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10002253"
            description: "脚踝关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10002263"
            description: "脚踝关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10002273"
            description: "脚踝关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10002283"
            description: "脚踝关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10002293"
            description: "脚踝关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10002993"
            description: "脚踝关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Knee"
        submodule_name: "膝盖电机"
        submodule_id: "03"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10003003"
            description: "膝盖关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10003013"
            description: "膝盖关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10003023"
            description: "膝盖关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10003033"
            description: "膝盖关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10003043"
            description: "膝盖关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10003053"
            description: "膝盖关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10003063"
            description: "膝盖关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10003073"
            description: "膝盖关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10003083"
            description: "膝盖关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10003093"
            description: "膝盖关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10003103"
            description: "膝盖关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10003113"
            description: "膝盖关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10003123"
            description: "膝盖关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10003133"
            description: "膝盖关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10003143"
            description: "膝盖关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10003153"
            description: "膝盖关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10003163"
            description: "膝盖关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10003173"
            description: "膝盖关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10003183"
            description: "膝盖关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10003193"
            description: "膝盖关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10003203"
            description: "膝盖关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10003213"
            description: "膝盖关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10003223"
            description: "膝盖关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10003233"
            description: "膝盖关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10003243"
            description: "膝盖关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10003253"
            description: "膝盖关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10003263"
            description: "膝盖关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10003273"
            description: "膝盖关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10003283"
            description: "膝盖关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10003293"
            description: "膝盖关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10003993"
            description: "膝盖关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Buttock"
        submodule_name: "臀部电机"
        submodule_id: "04"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10004003"
            description: "臀部关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10004013"
            description: "臀部关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10004023"
            description: "臀部关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10004033"
            description: "臀部关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10004043"
            description: "臀部关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10004053"
            description: "臀部关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10004063"
            description: "臀部关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10004073"
            description: "臀部关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10004083"
            description: "臀部关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10004093"
            description: "臀部关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10004103"
            description: "臀部关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10004113"
            description: "臀部关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10004123"
            description: "臀部关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10004133"
            description: "臀部关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10004143"
            description: "臀部关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10004153"
            description: "臀部关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10004163"
            description: "臀部关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10004173"
            description: "臀部关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10004183"
            description: "臀部关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10004193"
            description: "臀部关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10004203"
            description: "臀部关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10004213"
            description: "臀部关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10004223"
            description: "臀部关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10004233"
            description: "臀部关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10004243"
            description: "臀部关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10004253"
            description: "臀部关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10004263"
            description: "臀部关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10004273"
            description: "臀部关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10004283"
            description: "臀部关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10004293"
            description: "臀部关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10004993"
            description: "臀部关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Waist"
        submodule_name: "腰部电机"
        submodule_id: "05"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10005003"
            description: "腰部关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10005013"
            description: "腰部关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10005023"
            description: "腰部关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10005033"
            description: "腰部关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10005043"
            description: "腰部关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10005053"
            description: "腰部关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10005063"
            description: "腰部关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10005073"
            description: "腰部关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10005083"
            description: "腰部关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10005093"
            description: "腰部关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10005103"
            description: "腰部关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10005113"
            description: "腰部关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10005123"
            description: "腰部关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10005133"
            description: "腰部关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10005143"
            description: "腰部关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10005153"
            description: "腰部关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10005163"
            description: "腰部关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10005173"
            description: "腰部关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10005183"
            description: "腰部关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10005193"
            description: "腰部关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10005203"
            description: "腰部关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10005213"
            description: "腰部关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10005223"
            description: "腰部关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10005233"
            description: "腰部关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10005243"
            description: "腰部关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10005253"
            description: "腰部关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10005263"
            description: "腰部关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10005273"
            description: "腰部关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10005283"
            description: "腰部关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10005293"
            description: "腰部关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10005993"
            description: "腰部关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Neck1"
        submodule_name: "颈部第一关节"
        submodule_id: "07"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10007003"
            description: "颈部第一关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10007013"
            description: "颈部第一关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10007023"
            description: "颈部第一关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10007033"
            description: "颈部第一关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10007043"
            description: "颈部第一关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10007053"
            description: "颈部第一关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10007063"
            description: "颈部第一关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10007073"
            description: "颈部第一关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10007083"
            description: "颈部第一关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10007093"
            description: "颈部第一关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10007103"
            description: "颈部第一关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10007113"
            description: "颈部第一关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10007123"
            description: "颈部第一关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10007133"
            description: "颈部第一关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10007143"
            description: "颈部第一关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10007153"
            description: "颈部第一关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10007163"
            description: "颈部第一关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10007173"
            description: "颈部第一关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10007183"
            description: "颈部第一关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10007193"
            description: "颈部第一关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10007203"
            description: "颈部第一关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10007213"
            description: "颈部第一关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10007223"
            description: "颈部第一关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10007233"
            description: "颈部第一关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10007243"
            description: "颈部第一关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10007253"
            description: "颈部第一关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10007263"
            description: "颈部第一关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10007273"
            description: "颈部第一关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10007283"
            description: "颈部第一关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10007293"
            description: "颈部第一关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10007993"
            description: "颈部第一关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Neck2"
        submodule_name: "颈部第二关节"
        submodule_id: "08"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10008003"
            description: "颈部第二关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10008013"
            description: "颈部第二关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10008023"
            description: "颈部第二关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10008033"
            description: "颈部第二关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10008043"
            description: "颈部第二关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10008053"
            description: "颈部第二关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10008063"
            description: "颈部第二关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10008073"
            description: "颈部第二关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10008083"
            description: "颈部第二关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10008093"
            description: "颈部第二关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10008103"
            description: "颈部第二关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10008113"
            description: "颈部第二关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10008123"
            description: "颈部第二关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10008133"
            description: "颈部第二关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10008143"
            description: "颈部第二关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10008153"
            description: "颈部第二关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10008163"
            description: "颈部第二关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10008173"
            description: "颈部第二关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10008183"
            description: "颈部第二关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10008193"
            description: "颈部第二关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10008203"
            description: "颈部第二关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10008213"
            description: "颈部第二关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10008223"
            description: "颈部第二关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10008233"
            description: "颈部第二关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10008243"
            description: "颈部第二关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10008253"
            description: "颈部第二关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10008263"
            description: "颈部第二关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10008273"
            description: "颈部第二关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10008283"
            description: "颈部第二关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10008293"
            description: "颈部第二关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10008993"
            description: "颈部第二关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Left_J1"
        submodule_name: "左臂第一关节"
        submodule_id: "09"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10009003"
            description: "左臂第一关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10009013"
            description: "左臂第一关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10009023"
            description: "左臂第一关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10009033"
            description: "左臂第一关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10009043"
            description: "左臂第一关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10009053"
            description: "左臂第一关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10009063"
            description: "左臂第一关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10009073"
            description: "左臂第一关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10009083"
            description: "左臂第一关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10009093"
            description: "左臂第一关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10009103"
            description: "左臂第一关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10009113"
            description: "左臂第一关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10009123"
            description: "左臂第一关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10009133"
            description: "左臂第一关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10009143"
            description: "左臂第一关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10009153"
            description: "左臂第一关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10009163"
            description: "左臂第一关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10009173"
            description: "左臂第一关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10009183"
            description: "左臂第一关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10009193"
            description: "左臂第一关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10009203"
            description: "左臂第一关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10009213"
            description: "左臂第一关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10009223"
            description: "左臂第一关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10009233"
            description: "左臂第一关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10009243"
            description: "左臂第一关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10009253"
            description: "左臂第一关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10009263"
            description: "左臂第一关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10009273"
            description: "左臂第一关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10009283"
            description: "左臂第一关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10009293"
            description: "左臂第一关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10009993"
            description: "左臂第一关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Left_J2"
        submodule_name: "左臂第二关节"
        submodule_id: "10"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10010003"
            description: "左臂第二关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10010013"
            description: "左臂第二关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10010023"
            description: "左臂第二关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10010033"
            description: "左臂第二关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10010043"
            description: "左臂第二关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10010053"
            description: "左臂第二关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10010063"
            description: "左臂第二关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10010073"
            description: "左臂第二关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10010083"
            description: "左臂第二关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10010093"
            description: "左臂第二关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10010103"
            description: "左臂第二关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10010113"
            description: "左臂第二关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10010123"
            description: "左臂第二关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10010133"
            description: "左臂第二关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10010143"
            description: "左臂第二关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10010153"
            description: "左臂第二关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10010163"
            description: "左臂第二关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10010173"
            description: "左臂第二关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10010183"
            description: "左臂第二关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10010193"
            description: "左臂第二关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10010203"
            description: "左臂第二关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10010213"
            description: "左臂第二关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10010223"
            description: "左臂第二关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10010233"
            description: "左臂第二关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10010243"
            description: "左臂第二关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10010253"
            description: "左臂第二关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10010263"
            description: "左臂第二关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10010273"
            description: "左臂第二关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10010283"
            description: "左臂第二关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10010293"
            description: "左臂第二关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10010993"
            description: "左臂第二关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Left_J3"
        submodule_name: "左臂第三关节"
        submodule_id: "11"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10011003"
            description: "左臂第三关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10011013"
            description: "左臂第三关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10011023"
            description: "左臂第三关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10011033"
            description: "左臂第三关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10011043"
            description: "左臂第三关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10011053"
            description: "左臂第三关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10011063"
            description: "左臂第三关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10011073"
            description: "左臂第三关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10011083"
            description: "左臂第三关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10011093"
            description: "左臂第三关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10011103"
            description: "左臂第三关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10011113"
            description: "左臂第三关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10011123"
            description: "左臂第三关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10011133"
            description: "左臂第三关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10011143"
            description: "左臂第三关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10011153"
            description: "左臂第三关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10011163"
            description: "左臂第三关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10011173"
            description: "左臂第三关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10011183"
            description: "左臂第三关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10011193"
            description: "左臂第三关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10011203"
            description: "左臂第三关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10011213"
            description: "左臂第三关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10011223"
            description: "左臂第三关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10011233"
            description: "左臂第三关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10011243"
            description: "左臂第三关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10011253"
            description: "左臂第三关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10011263"
            description: "左臂第三关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10011273"
            description: "左臂第三关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10011283"
            description: "左臂第三关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10011293"
            description: "左臂第三关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10011993"
            description: "左臂第三关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Left_J4"
        submodule_name: "左臂第四关节"
        submodule_id: "12"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10012003"
            description: "左臂第四关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10012013"
            description: "左臂第四关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10012023"
            description: "左臂第四关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10012033"
            description: "左臂第四关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10012043"
            description: "左臂第四关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10012053"
            description: "左臂第四关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10012063"
            description: "左臂第四关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10012073"
            description: "左臂第四关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10012083"
            description: "左臂第四关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10012093"
            description: "左臂第四关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10012103"
            description: "左臂第四关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10012113"
            description: "左臂第四关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10012123"
            description: "左臂第四关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10012133"
            description: "左臂第四关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10012143"
            description: "左臂第四关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10012153"
            description: "左臂第四关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10012163"
            description: "左臂第四关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10012173"
            description: "左臂第四关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10012183"
            description: "左臂第四关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10012193"
            description: "左臂第四关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10012203"
            description: "左臂第四关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10012213"
            description: "左臂第四关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10012223"
            description: "左臂第四关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10012233"
            description: "左臂第四关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10012243"
            description: "左臂第四关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10012253"
            description: "左臂第四关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10012263"
            description: "左臂第四关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10012273"
            description: "左臂第四关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10012283"
            description: "左臂第四关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10012293"
            description: "左臂第四关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10012993"
            description: "左臂第四关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Left_J5"
        submodule_name: "左臂第五关节"
        submodule_id: "13"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10013003"
            description: "左臂第五关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10013013"
            description: "左臂第五关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10013023"
            description: "左臂第五关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10013033"
            description: "左臂第五关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10013043"
            description: "左臂第五关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10013053"
            description: "左臂第五关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10013063"
            description: "左臂第五关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10013073"
            description: "左臂第五关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10013083"
            description: "左臂第五关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10013093"
            description: "左臂第五关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10013103"
            description: "左臂第五关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10013113"
            description: "左臂第五关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10013123"
            description: "左臂第五关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10013133"
            description: "左臂第五关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10013143"
            description: "左臂第五关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10013153"
            description: "左臂第五关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10013163"
            description: "左臂第五关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10013173"
            description: "左臂第五关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10013183"
            description: "左臂第五关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10013193"
            description: "左臂第五关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10013203"
            description: "左臂第五关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10013213"
            description: "左臂第五关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10013223"
            description: "左臂第五关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10013233"
            description: "左臂第五关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10013243"
            description: "左臂第五关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10013253"
            description: "左臂第五关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10013263"
            description: "左臂第五关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10013273"
            description: "左臂第五关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10013283"
            description: "左臂第五关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10013293"
            description: "左臂第五关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10013993"
            description: "左臂第五关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Left_J6"
        submodule_name: "左臂第六关节"
        submodule_id: "14"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10014003"
            description: "左臂第六关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10014013"
            description: "左臂第六关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10014023"
            description: "左臂第六关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10014033"
            description: "左臂第六关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10014043"
            description: "左臂第六关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10014053"
            description: "左臂第六关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10014063"
            description: "左臂第六关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10014073"
            description: "左臂第六关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10014083"
            description: "左臂第六关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10014093"
            description: "左臂第六关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10014103"
            description: "左臂第六关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10014113"
            description: "左臂第六关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10014123"
            description: "左臂第六关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10014133"
            description: "左臂第六关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10014143"
            description: "左臂第六关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10014153"
            description: "左臂第六关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10014163"
            description: "左臂第六关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10014173"
            description: "左臂第六关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10014183"
            description: "左臂第六关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10014193"
            description: "左臂第六关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10014203"
            description: "左臂第六关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10014213"
            description: "左臂第六关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10014223"
            description: "左臂第六关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10014233"
            description: "左臂第六关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10014243"
            description: "左臂第六关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10014253"
            description: "左臂第六关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10014263"
            description: "左臂第六关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10014273"
            description: "左臂第六关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10014283"
            description: "左臂第六关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10014293"
            description: "左臂第六关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10014993"
            description: "左臂第六关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Left_J7"
        submodule_name: "左臂第七关节"
        submodule_id: "15"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10015003"
            description: "左臂第七关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10015013"
            description: "左臂第七关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10015023"
            description: "左臂第七关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10015033"
            description: "左臂第七关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10015043"
            description: "左臂第七关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10015053"
            description: "左臂第七关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10015063"
            description: "左臂第七关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10015073"
            description: "左臂第七关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10015083"
            description: "左臂第七关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10015093"
            description: "左臂第七关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10015103"
            description: "左臂第七关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10015113"
            description: "左臂第七关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10015123"
            description: "左臂第七关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10015133"
            description: "左臂第七关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10015143"
            description: "左臂第七关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10015153"
            description: "左臂第七关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10015163"
            description: "左臂第七关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10015173"
            description: "左臂第七关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10015183"
            description: "左臂第七关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10015193"
            description: "左臂第七关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10015203"
            description: "左臂第七关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10015213"
            description: "左臂第七关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10015223"
            description: "左臂第七关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10015233"
            description: "左臂第七关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10015243"
            description: "左臂第七关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10015253"
            description: "左臂第七关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10015263"
            description: "左臂第七关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10015273"
            description: "左臂第七关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10015283"
            description: "左臂第七关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10015293"
            description: "左臂第七关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10015993"
            description: "左臂第七关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Right_J1"
        submodule_name: "右臂第一关节"
        submodule_id: "17"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10017003"
            description: "右臂第一关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10017013"
            description: "右臂第一关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10017023"
            description: "右臂第一关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10017033"
            description: "右臂第一关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10017043"
            description: "右臂第一关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10017053"
            description: "右臂第一关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10017063"
            description: "右臂第一关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10017073"
            description: "右臂第一关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10017083"
            description: "右臂第一关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10017093"
            description: "右臂第一关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10017103"
            description: "右臂第一关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10017113"
            description: "右臂第一关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10017123"
            description: "右臂第一关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10017133"
            description: "右臂第一关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10017143"
            description: "右臂第一关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10017153"
            description: "右臂第一关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10017163"
            description: "右臂第一关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10017173"
            description: "右臂第一关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10017183"
            description: "右臂第一关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10017193"
            description: "右臂第一关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10017203"
            description: "右臂第一关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10017213"
            description: "右臂第一关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10017223"
            description: "右臂第一关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10017233"
            description: "右臂第一关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10017243"
            description: "右臂第一关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10017253"
            description: "右臂第一关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10017263"
            description: "右臂第一关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10017273"
            description: "右臂第一关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10017283"
            description: "右臂第一关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10017293"
            description: "右臂第一关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10017993"
            description: "右臂第一关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Right_J2"
        submodule_name: "右臂第二关节"
        submodule_id: "18"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10018003"
            description: "右臂第二关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10018013"
            description: "右臂第二关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10018023"
            description: "右臂第二关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10018033"
            description: "右臂第二关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10018043"
            description: "右臂第二关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10018053"
            description: "右臂第二关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10018063"
            description: "右臂第二关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10018073"
            description: "右臂第二关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10018083"
            description: "右臂第二关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10018093"
            description: "右臂第二关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10018103"
            description: "右臂第二关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10018113"
            description: "右臂第二关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10018123"
            description: "右臂第二关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10018133"
            description: "右臂第二关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10018143"
            description: "右臂第二关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10018153"
            description: "右臂第二关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10018163"
            description: "右臂第二关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10018173"
            description: "右臂第二关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10018183"
            description: "右臂第二关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10018193"
            description: "右臂第二关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10018203"
            description: "右臂第二关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10018213"
            description: "右臂第二关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10018223"
            description: "右臂第二关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10018233"
            description: "右臂第二关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10018243"
            description: "右臂第二关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10018253"
            description: "右臂第二关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10018263"
            description: "右臂第二关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10018273"
            description: "右臂第二关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10018283"
            description: "右臂第二关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10018293"
            description: "右臂第二关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10018993"
            description: "右臂第二关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Right_J3"
        submodule_name: "右臂第三关节"
        submodule_id: "19"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10019003"
            description: "右臂第三关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10019013"
            description: "右臂第三关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10019023"
            description: "右臂第三关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10019033"
            description: "右臂第三关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10019043"
            description: "右臂第三关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10019053"
            description: "右臂第三关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10019063"
            description: "右臂第三关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10019073"
            description: "右臂第三关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10019083"
            description: "右臂第三关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10019093"
            description: "右臂第三关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10019103"
            description: "右臂第三关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10019113"
            description: "右臂第三关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10019123"
            description: "右臂第三关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10019133"
            description: "右臂第三关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10019143"
            description: "右臂第三关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10019153"
            description: "右臂第三关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10019163"
            description: "右臂第三关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10019173"
            description: "右臂第三关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10019183"
            description: "右臂第三关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10019193"
            description: "右臂第三关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10019203"
            description: "右臂第三关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10019213"
            description: "右臂第三关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10019223"
            description: "右臂第三关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10019233"
            description: "右臂第三关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10019243"
            description: "右臂第三关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10019253"
            description: "右臂第三关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10019263"
            description: "右臂第三关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10019273"
            description: "右臂第三关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10019283"
            description: "右臂第三关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10019293"
            description: "右臂第三关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10019993"
            description: "右臂第三关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Right_J4"
        submodule_name: "右臂第四关节"
        submodule_id: "20"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10020003"
            description: "右臂第四关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10020013"
            description: "右臂第四关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10020023"
            description: "右臂第四关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10020033"
            description: "右臂第四关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10020043"
            description: "右臂第四关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10020053"
            description: "右臂第四关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10020063"
            description: "右臂第四关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10020073"
            description: "右臂第四关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10020083"
            description: "右臂第四关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10020093"
            description: "右臂第四关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10020103"
            description: "右臂第四关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10020113"
            description: "右臂第四关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10020123"
            description: "右臂第四关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10020133"
            description: "右臂第四关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10020143"
            description: "右臂第四关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10020153"
            description: "右臂第四关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10020163"
            description: "右臂第四关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10020173"
            description: "右臂第四关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10020183"
            description: "右臂第四关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10020193"
            description: "右臂第四关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10020203"
            description: "右臂第四关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10020213"
            description: "右臂第四关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10020223"
            description: "右臂第四关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10020233"
            description: "右臂第四关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10020243"
            description: "右臂第四关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10020253"
            description: "右臂第四关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10020263"
            description: "右臂第四关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10020273"
            description: "右臂第四关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10020283"
            description: "右臂第四关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10020293"
            description: "右臂第四关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10020993"
            description: "右臂第四关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Right_J5"
        submodule_name: "右臂第五关节"
        submodule_id: "21"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10021003"
            description: "右臂第五关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10021013"
            description: "右臂第五关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10021023"
            description: "右臂第五关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10021033"
            description: "右臂第五关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10021043"
            description: "右臂第五关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10021053"
            description: "右臂第五关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10021063"
            description: "右臂第五关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10021073"
            description: "右臂第五关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10021083"
            description: "右臂第五关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10021093"
            description: "右臂第五关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10021103"
            description: "右臂第五关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10021113"
            description: "右臂第五关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10021123"
            description: "右臂第五关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10021133"
            description: "右臂第五关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10021143"
            description: "右臂第五关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10021153"
            description: "右臂第五关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10021163"
            description: "右臂第五关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10021173"
            description: "右臂第五关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10021183"
            description: "右臂第五关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10021193"
            description: "右臂第五关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10021203"
            description: "右臂第五关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10021213"
            description: "右臂第五关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10021223"
            description: "右臂第五关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10021233"
            description: "右臂第五关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10021243"
            description: "右臂第五关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10021253"
            description: "右臂第五关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10021263"
            description: "右臂第五关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10021273"
            description: "右臂第五关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10021283"
            description: "右臂第五关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10021293"
            description: "右臂第五关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10021993"
            description: "右臂第五关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Right_J6"
        submodule_name: "右臂第六关节"
        submodule_id: "22"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10022003"
            description: "右臂第六关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10022013"
            description: "右臂第六关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10022023"
            description: "右臂第六关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10022033"
            description: "右臂第六关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10022043"
            description: "右臂第六关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10022053"
            description: "右臂第六关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10022063"
            description: "右臂第六关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10022073"
            description: "右臂第六关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10022083"
            description: "右臂第六关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10022093"
            description: "右臂第六关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10022103"
            description: "右臂第六关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10022113"
            description: "右臂第六关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10022123"
            description: "右臂第六关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10022133"
            description: "右臂第六关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10022143"
            description: "右臂第六关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10022153"
            description: "右臂第六关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10022163"
            description: "右臂第六关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10022173"
            description: "右臂第六关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10022183"
            description: "右臂第六关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10022193"
            description: "右臂第六关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10022203"
            description: "右臂第六关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10022213"
            description: "右臂第六关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10022223"
            description: "右臂第六关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10022233"
            description: "右臂第六关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10022243"
            description: "右臂第六关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10022253"
            description: "右臂第六关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10022263"
            description: "右臂第六关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10022273"
            description: "右臂第六关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10022283"
            description: "右臂第六关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10022293"
            description: "右臂第六关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10022993"
            description: "右臂第六关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Right_J7"
        submodule_name: "右臂第七关节"
        submodule_id: "23"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10023003"
            description: "右臂第七关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10023013"
            description: "右臂第七关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10023023"
            description: "右臂第七关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10023033"
            description: "右臂第七关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10023043"
            description: "右臂第七关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10023053"
            description: "右臂第七关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
            solution: "测量驱动器输入端静态电压及运动、减速时的电压峰值，检查电源、接线和泄放回路；降低负载、速度或加减速冲击，并核对该型号的允许电压与固件参数。同川可结合 Pr0.11 监测值排查，阈值按实际型号确认。"

          # xx=06; ZeroErr: 0x3220; TCDriver: 0x00A
          - status_code: "10023063"
            description: "右臂第七关节：母线欠压。母线电压低于驱动器设置的最低允许值。"
            solution: "测量驱动器输入端启动和运动时的电压，检查供电功率、线径、连接器压降与多模组供电方式；排除机械卡滞并减小启动加速度、负载。核对实际型号的欠压配置；同川 0x00A 在 V2.2 中为不可复位故障，供电恢复后按厂家流程处理。"

          # xx=07; ZeroErr: 0x4110; TCDriver: 0x00F, 0x010, 0x018, 0xE81, 0xE82
          - status_code: "10023073"
            description: "右臂第七关节：温度过高。电机、驱动器、编码器或功率器件温度异常，包含当前映射合并的温度警告。"
            solution: "停止运动并等待温度恢复，检查环境温度、安装散热和持续电流、负载是否超出额定范围；改善散热并核对型号对应的温度保护参数。同川 0x018 为编码器过热，V2.2 将其列为不可复位故障；温度警告与故障按原始码区分，冷却及正常供电后仍报错时联系厂家检修。"

          # xx=08; ZeroErr: 0x7121; TCDriver: 0x01E
          - status_code: "10023083"
            description: "右臂第七关节：电机堵转。关节电流较大但运动速度过低，或检测到堵转。"
            solution: "停止运动并支撑负载，检查干涉、卡死、阻力、额定力矩及抱闸是否正常释放；零差用 eTuner 核对持续电流、堵转保护和电角度补偿。仅在满足空载条件时按手册自检；同川 0x01E 在 V2.2 中为不可复位故障，持续异常送修。"

          # xx=09; ZeroErr: 0x7305; TCDriver: 0x02C, 0x02D, 0x02E, 0x02F
          - status_code: "10023093"
            description: "右臂第七关节：负载端编码器读取或配置异常。负载端编码器数据错误；同川对应第二编码器断线、解析、CRC 或配置异常。"
            solution: "检查关节供电在启动和运动时是否稳定，断电检查编码器线缆、连接器及接地。零差核对固件版本与编码器读数；同川按 0x02C/0x02D/0x02E/0x02F 区分断线、内部解析、CRC 和配置问题，0x02C 在 V2.2 中不可复位；按厂家要求重新上电后仍异常时，联系厂家核对配置及内部电路。"

          # xx=10; ZeroErr: 0x7306; TCDriver: 0x007, 0x008
          - status_code: "10023103"
            description: "右臂第七关节：电机端编码器读取异常。电机端编码器数据错误；同川对应编码器断线或 CRC 校验错误。"
            solution: "检查供电跌落、编码器线缆和接插件，排除接地、布线干扰；零差结合 eTuner 读取状态并核对匹配固件。同川 0x007/0x008 在 V2.2 中为不可复位故障，按手册重新上电后仍出现时联系厂家检修。"

          # xx=11; ZeroErr: 0x730D; TCDriver: 0x019, 0x031
          - status_code: "10023113"
            description: "右臂第七关节：编码器电池低压警告。编码器保持用电池电压低于警告条件，需按厂家原始码确认。"
            solution: "测量电池电压并检查型号、线缆和接插件，按对应型号更换电池。零差更换后按 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器并重新确认零点；同川按 0x019/0x031 对应电池处理，V2.2 将其列为不可复位故障，不能仅依赖清错命令。"

          # xx=12; ZeroErr: 0x730F; TCDriver: 0x01A, 0x030
          - status_code: "10023123"
            description: "右臂第七关节：编码器电池电压低。编码器保持用电池电压低于工作或报警条件。"
            solution: "检查电池是否安装、型号是否正确、电压及接口是否松动或断线，按型号更换或重新连接电池。零差按 V3.40 第 9.4/10.4 节重置负载端编码器并确认零点；同川按 0x01A/0x030 处理，V2.2 将其列为不可复位故障。"

          # xx=13; ZeroErr: 0x7311
          - status_code: "10023133"
            description: "右臂第七关节：电机端采样位置误差超限。相邻采样周期的电机端编码器位置变化异常。"
            solution: "检查供电快速跌落、反复快速上电和编码器配置；在失能状态下用 eTuner 示波器观察电机转角是否跳变，核对类型、参数和分辨率。运动时伴随异响或静止读数仍异常时，保存波形并联系厂家排查硬件。"

          # xx=14; ZeroErr: 0x7314
          - status_code: "10023143"
            description: "右臂第七关节：编码器电池重新接入。负载端多圈编码器检测到电池更换或掉电状态信息。"
            solution: "检查电池接口和线缆是否松动；按零差 V3.40 第 9.4/10.4 节，通过 eTuner 的编码器界面执行重置负载端编码器，并重新确认设备零点。单纯清除控制字故障不能替代此校准流程。"

          # xx=15; ZeroErr: 0x7315
          - status_code: "10023153"
            description: "右臂第七关节：负载端采样位置误差超限。相邻采样周期的负载端编码器位置变化异常。"
            solution: "检查供电波动、快速断电上电和负载端编码器配置；正常上电静止后，通过 eTuner 编码器界面观察读数是否跳变。核对类型、参数和分辨率，运动时检查异响；持续异常时保存诊断数据并联系厂家。"

          # xx=16; ZeroErr: 0x7350
          - status_code: "10023163"
            description: "右臂第七关节：电机端编码器类型不支持。电机端编码器未正确配置或类型不受支持。"
            solution: "核对模组实际编码器类型及固件支持范围，检查 eTuner 中的类型、参数和分辨率配置；使用与模组匹配的厂家参数，配置正确仍报错时联系厂家确认固件与硬件版本。"

          # xx=17; ZeroErr: 0x7374
          - status_code: "10023173"
            description: "右臂第七关节：多圈位置错误。多圈保持信息异常，可能与电池更换后未复位或电池接口松动有关。"
            solution: "检查多圈电池和接口稳定性，按零差 V3.40 第 9.4/10.4 节使用 eTuner 重置负载端编码器，并重新确认设备零点；重新上电后复核位置，持续异常时保存原始错误码和编码器数据联系厂家。"

          # xx=18; ZeroErr: 0x7377
          - status_code: "10023183"
            description: "右臂第七关节：编码器复位引脚异常。上电初始化时检测到多圈编码器复位引脚异常状态。"
            solution: "检查供电是否在上电时快速跌落或波动，确认电源和接线稳定；稳定供电后仍出现时，保存原始错误码并联系厂家检查编码器硬件电路。"

          # xx=19; ZeroErr: 0x737A
          - status_code: "10023193"
            description: "右臂第七关节：负载端编码器启动错误。上电初始化时读取负载端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=20; ZeroErr: 0x737E
          - status_code: "10023203"
            description: "右臂第七关节：电机端编码器启动错误。上电初始化时读取电机端编码器返回信息失败。"
            solution: "测量上电瞬间的供电波形，排除电压快速跌落或波动并检查连接器；由厂家确认匹配固件和编码器硬件状态，供电稳定后仍报错时保存诊断信息送检。"

          # xx=21; ZeroErr: 0x8130
          - status_code: "10023213"
            description: "右臂第七关节：CAN 心跳错误。使能状态下，心跳消费者未在配置时间内收到心跳生产者报文。"
            solution: "确认关节实际启用的通信模式，检查 CAN 线缆、连接器、心跳生产周期及消费者超时配置；零差协议手册建议消费者超时大于生产周期的两倍。EtherCAT 使用场景仍出现此码时，核对残留 CAN 配置和原始固件状态。"

          # xx=22; ZeroErr: 0x8400; TCDriver: 0x029, 0x032
          - status_code: "10023223"
            description: "右臂第七关节：速度误差或速度指令超限。零差为速度跟随误差超限；同川为目标增量过大或速度指令超限。"
            solution: "检查目标轨迹的速度、加速度、位置增量及单位换算，排除负载、机械干涉和供电不足；核对电流、速度、位置环增益与速度保护参数。同川 0x029 按手册减小位置指令阶跃和加速度；零差可用 eTuner 采集目标位置、实际速度及电流波形定位。"

          # xx=23; ZeroErr: 0x8401; TCDriver: 0x012
          - status_code: "10023233"
            description: "右臂第七关节：电机速度过高。实际电机转速超过驱动器允许范围。"
            solution: "停止运动，核对目标速度、编码器类型与分辨率、最大允许速度及速度环参数；检查轨迹突变和编码器干扰，恢复与该型号匹配的参数和正常接地后再验证，持续异常联系厂家。"

          # xx=24; ZeroErr: 0x8500; TCDriver: 0x013, 0x02A, 0x02B, 0xE85, 0xE87, 0xE88
          - status_code: "10023243"
            description: "右臂第七关节：位置偏差或行程限制异常。位置跟随偏差过大，或同川目标/实际位置触及正负向软件行程范围。"
            solution: "检查机械干涉、负载惯量、抱闸释放、供电与目标轨迹；核对位置环和速度环、转矩限制及位置误差参数。按同川原始码核对 0x6065 跟随误差、0x607D 软件行程及机械边界，修正超出范围的目标指令；零差可用 eTuner 保存位置和速度跟随波形。"

          # xx=25; ZeroErr: 0xA000; TCDriver: 0x022, 0x027
          - status_code: "10023253"
            description: "右臂第七关节：EtherCAT 通信中断或主站退出 OP。主站掉线、退出 OP，或未持续向从站提供 PDO。"
            solution: "检查 EtherCAT 网线和连接器、主站进程及主机供电，结合 system 监控与主站日志确认是否退出 OP；检查实时线程调度、周期和 PDO 看门狗配置。恢复可靠通信后，按对应厂商允许的流程处理原始故障并重新确认从站进入 OP。"

          # xx=26; ZeroErr: 0xF004; TCDriver: 0x020, 0x023, 0x024, 0x025, 0x026, 0x028
          - status_code: "10023263"
            description: "右臂第七关节：EtherCAT 初始化或通信配置错误。从站初始化自检失败，或同川 PDO、索引、同步时间、看门狗配置不合法。"
            solution: "读取原始码并核对对象字典、ESI/XML、固件与 PDO 配置。零差 0xF004 检查固件、ESI 与硬件；同川检查 0x020/0x023..0x026/0x028 对应 ESC、PDO 读写权限、索引/子索引、DC 周期及看门狗配置，按当前固件手册修正后再初始化。"

          # xx=27; ZeroErr: 0xF005
          - status_code: "10023273"
            description: "右臂第七关节：STO 功能被激活。驱动器安全转矩关闭接口处于激活状态。"
            solution: "检查急停、安全控制器和 STO 线路及状态，按设备安全流程消除触发原因；确认安全回路按设计恢复到允许状态后，再按厂家流程复位并确认关节状态。"

          # xx=28; ZeroErr: 0xF006; TCDriver: 0x009
          - status_code: "10023283"
            description: "右臂第七关节：编码器计数错误。零差为多圈计数错误；同川为编码器内部计数错误。"
            solution: "零差检查是否在 Power 指示灯未熄灭时重新上电，按手册等待完全断电后再上电，并由厂家核对固件和多圈位置；涉及重置编码器后需确认零点。同川 0x009 在 V2.2 中为不可复位故障，稳定供电重启后仍报错时联系厂家检修。"

          # xx=29; ZeroErr: 0xF008
          - status_code: "10023293"
            description: "右臂第七关节：供电低于模组最低允许值。零差检测到模组供电跌落至其允许的最低输入电压以下。"
            solution: "测量启动和运动工况下模组输入端的电压波形，检查电源输出功率、供电接线及连接器压降；更换满足当前工况的电源并由厂家核对匹配固件。协议 v1.9 对 0xF008 记载为低于 19V，实际供电范围仍以当前模组型号和固件为准。"

          # xx=99; TCDriver: 0x003, 0x004, 0x005, 0x006, 0x00C, 0x00D, 0x00E, 0x01B, 0x01C, 0x01D, 0x021, 0x033, 0x034, 0x035, 0xE83, 0xE84, 0xE86; 以及未识别的任意非零原始码（含 TCDriver 0xE89/0xE8A）
          - status_code: "10023993"
            description: "右臂第七关节：未细分的原始故障或警告。原始码未识别，或虽为已知厂商故障但尚无对应的标准类别。"
            solution: "先读取该关节 joint_feedback[].joint_error_code（0x603F）及日志，记录厂商、型号和固件版本后按原始码查手册。同川需分别检查 EEPROM、ADC、缺相、过载、驱动器与电机匹配、回零、主电源、DC 同步或扭矩传感器等原因；V2.2 的 0xE89/0xE8A 指令超程也在当前程序中归入本类，需核对轨迹及行程。"

      - submodule: "Unknown Motor"
        submodule_name: "未识别名称的电机关节"
        submodule_id: "99"
        status_codes:
          # xx=00; ZeroErr: 0x2214; TCDriver: 0x001, 0x002
          - status_code: "10099003"
            description: "未识别名称的电机关节：电流过流或短路保护。检测到电机电流或相电流超过保护条件。"
            solution: "先核对 joint_feedback[].joint_name 与硬件配置，当前名称未命中固定模块表；结合各关节原始码定位并补充名称映射。停止该关节运动，断电后检查动力线相间、对地短路及接线顺序，排除碰撞、卡滞和过载；零差核对电流环 Kp/Ki 与电流保护参数是否符合出厂配置。同川 0x001/0x002 在 V2.2 中为不可复位故障，排除原因后按厂家流程处理，持续报错送修。"

          # xx=01; ZeroErr: 0x2250
          - status_code: "10099013"
            description: "未识别名称的电机关节：三相电流和超限。三相电流检测的和误差超过允许阈值。"
            solution: "先核对 joint_feedback[].joint_name 与硬件配置，当前名称未命中固定模块表；结合各关节原始码定位并补充名称映射。断电检查电机三相线的断线、接错和接触不良，排除过载、碰撞及机械阻力；使用 eTuner 核对电流环 Kp/Ki 与三相电流和保护设置，优先恢复匹配该模组的出厂参数。"

          # xx=02; ZeroErr: 0x2341
          - status_code: "10099023"
            description: "未识别名称的电机关节：U 相过流。U 相电流超过单相电流保护条件。"
            solution: "先核对 joint_feedback[].joint_name 与硬件配置，当前名称未命中固定模块表；结合各关节原始码定位并补充名称映射。断电检查 U 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=03; ZeroErr: 0x2342
          - status_code: "10099033"
            description: "未识别名称的电机关节：V 相过流。V 相电流超过单相电流保护条件。"
            solution: "先核对 joint_feedback[].joint_name 与硬件配置，当前名称未命中固定模块表；结合各关节原始码定位并补充名称映射。断电检查 V 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=04; ZeroErr: 0x2343
          - status_code: "10099043"
            description: "未识别名称的电机关节：W 相过流。W 相电流超过单相电流保护条件。"
            solution: "先核对 joint_feedback[].joint_name 与硬件配置，当前名称未命中固定模块表；结合各关节原始码定位并补充名称映射。断电检查 W 相动力线及相间、对壳体绝缘，排除过载、卡滞与冲击；用 eTuner 核对电流环 Kp/Ki、单相及总电流保护参数与该型号的出厂设置，故障持续时联系厂家检修。"

          # xx=05; ZeroErr: 0x3210; TCDriver: 0x00B
          - status_code: "10099053"
            description: "未识别名称的电机关节：母线过压。母线电压过高，可能与电源输出或减速回馈有关。"
