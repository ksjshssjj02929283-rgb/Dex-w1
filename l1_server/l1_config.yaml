robot_type: l1
version: v03
run_mode: 0   #上肢运动模式: 0为位置模式, 1为力控pd模式

l1_v01:
  ankle_params:
    left:
      r_roll_center: [0.0, 0.0, 3.0]
      r_pitch_center: [0.0, 0.0, 3.0]

      # 1, 2为电机接线顺序, 而非物理位置
      is_left_motor1: false          # 电机1的物理位置, 是否为脚踝的左电机
      r_a1: [-46, 0, 257.94]
      r_c1: [-46, -59, 0.0]
      l_bar1: 60
      l_rod1: 268.354
      alpha_1_rad: 0.1745  # 10°

      is_left_motor2: true         # 电机2的物理位置, 是否为脚踝的左电机
      r_a2: [-46, 0, 177.94]
      r_c2: [-46, 59, 0.0]
      l_bar2: 60
      l_rod2: 188.355
      alpha_2_rad: -0.1745  # -10°

    right:
      r_roll_center: [0.0, 0.0, 3.0]
      r_pitch_center: [0.0, 0.0, 3.0]

      is_left_motor1: true         # 电机1的物理位置, 是否为脚踝的左电机
      r_a1: [-46, 0, 257.94]
      r_c1: [-46, 59, 0.0]
      l_bar1: 60
      l_rod1: 268.354
      alpha_1_rad: -0.1745  # -10°

      is_left_motor2: false          # 电机2的物理位置, 是否为脚踝的左电机
      r_a2: [-46, 0, 177.94]
      r_c2: [-46, -59, 0.0]
      l_bar2: 60
      l_rod2: 188.355
      alpha_2_rad: 0.1745  # 10°

